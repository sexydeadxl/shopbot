services:
  - type: web
    name: shoopbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /healthz
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: D1_WORKER_URL
        sync: false
      - key: D1_WORKER_TOKEN
        sync: false
      - key: SUPPLIER_ENCRYPTION_KEY
        sync: false
